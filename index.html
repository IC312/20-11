<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letter Builder — Tạo link thư tri ân</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#33302a; --ink-soft:#5c564c;
  --paper:#fffdf6; --accent:#c1553f;
  --border:rgba(120,105,85,.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Be Vietnam Pro',system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 15% 20%, rgba(210,170,130,.12) 0, transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(200,160,120,.10) 0, transparent 45%),
    linear-gradient(180deg,#faf4e6 0%,#f0e6d2 100%);
  min-height:100vh; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.builder{max-width:1200px;margin:0 auto;padding:clamp(20px,4vw,48px) clamp(16px,3vw,32px);}
.page-head{text-align:center;margin-bottom:clamp(24px,4vw,44px);}
.kicker{margin:0 0 10px;font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:rgba(90,70,50,.65);font-weight:500;}
h1{margin:0;font-family:'Playfair Display',serif;font-weight:600;font-size:clamp(28px,5vw,46px);letter-spacing:-.015em;color:#2f2a22;}
h1 em{font-style:italic;color:var(--accent);font-weight:500;}
.sub{margin:10px 0 0;font-size:clamp(13px,1.7vw,15px);color:var(--ink-soft);font-weight:300;}
.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(20px,3vw,32px);align-items:start;}
@media(max-width:860px){.layout{grid-template-columns:1fr;}}
.card{background:var(--paper);border-radius:12px;padding:clamp(20px,3vw,32px);box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 20px 40px -20px rgba(80,60,40,.18),0 4px 12px rgba(80,60,40,.06);border:1px solid rgba(160,140,110,.12);}
.field{margin-bottom:20px;}
.field:last-child{margin-bottom:0;}
label.lbl{display:block;font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(90,70,50,.75);margin-bottom:8px;}
input[type="text"],textarea{width:100%;font-family:inherit;font-size:14.5px;line-height:1.6;color:var(--ink);background:#fffefa;border:1.5px solid var(--border);border-radius:8px;padding:11px 14px;transition:border-color .2s,box-shadow .2s,background .2s;resize:vertical;}
input[type="text"]:focus,textarea:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(193,85,63,.12);}
textarea{min-height:80px;}
.para-row{position:relative;margin-bottom:10px;display:flex;gap:8px;align-items:flex-start;}
.para-row textarea{flex:1;min-height:70px;}
.para-remove{flex:none;width:34px;height:34px;margin-top:4px;border:1.5px solid var(--border);background:transparent;border-radius:8px;cursor:pointer;color:var(--ink-soft);font-size:18px;line-height:1;transition:all .2s;}
.para-remove:hover{background:#fff0ec;border-color:var(--accent);color:var(--accent);}
.add-para{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border:1.5px dashed rgba(160,140,110,.5);background:transparent;border-radius:8px;cursor:pointer;color:var(--ink-soft);font-family:inherit;font-size:13px;font-weight:500;margin-top:6px;transition:all .2s;}
.add-para:hover{border-color:var(--accent);color:var(--accent);background:rgba(255,240,236,.5);}
.actions-card{position:sticky;top:20px;}
@media(max-width:860px){.actions-card{position:static;}}
.btn-primary{display:block;width:100%;padding:15px;border:none;border-radius:10px;background:linear-gradient(135deg,#d9694e,#b8452f);color:#fff8f2;font-family:inherit;font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;box-shadow:0 12px 22px -10px rgba(180,60,40,.6);transition:transform .25s cubic-bezier(.34,1.5,.64,1),box-shadow .25s,filter .25s;}
.btn-primary:hover{transform:translateY(-2px);filter:brightness(1.04);box-shadow:0 16px 28px -10px rgba(180,60,40,.7);}
.result{margin-top:20px;padding-top:20px;border-top:1px dashed var(--border);animation:fadeUp .5s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.link-out{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12.5px!important;color:var(--ink-soft)!important;background:#fbf6e9!important;}
.result-actions{display:flex;gap:8px;margin-top:12px;}
.btn-secondary{flex:1;padding:11px 14px;border:1.5px solid var(--border);background:#fffefa;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;color:var(--ink);text-decoration:none;text-align:center;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:5px;}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent);background:#fff5f1;}
.btn-secondary.copied{border-color:#4a8a4a;color:#4a8a4a;background:#f0f8f0;}
.link-meta{margin-top:12px;font-size:12px;color:var(--ink-soft);line-height:1.6;}
.link-meta.warn{color:#b87333;}
.tip{margin-top:20px;padding:14px 16px;border-radius:8px;background:rgba(201,162,39,.08);border:1px solid rgba(201,162,39,.22);font-size:12.5px;line-height:1.7;color:#6b5a30;}
.tip code{background:rgba(255,255,255,.6);padding:1px 5px;border-radius:3px;font-size:12px;}
</style>
</head>
<body>
<div class="builder">
  <header class="page-head">
    <p class="kicker">20 · 11 · Công cụ</p>
    <h1>Letter <em>Builder</em></h1>
    <p class="sub">Tuỳ biến nội dung lá thư và tạo link riêng cho từng Thầy Cô</p>
  </header>

  <div class="layout">
    <form class="card" onsubmit="return false;">
      <div class="field">
        <label class="lbl" for="inpTo">Người nhận</label>
        <input type="text" id="inpTo" value="Kính gửi Thầy, Cô," autocomplete="off">
      </div>

      <div class="field">
        <label class="lbl">Các đoạn thư</label>
        <div id="parasList"></div>
        <button type="button" class="add-para" id="addPara">+ Thêm đoạn</button>
      </div>

      <div class="field">
        <label class="lbl" for="inpSign">Chữ ký</label>
        <input type="text" id="inpSign" value="Học trò của Thầy Cô" autocomplete="off">
      </div>

      <div class="field">
        <label class="lbl" for="inpSignSub">Dòng phụ dưới chữ ký</label>
        <input type="text" id="inpSignSub" value="With love · 20.11" autocomplete="off">
      </div>

      <div class="field">
        <label class="lbl" for="inpFinale">Lời nhắn cuối</label>
        <textarea id="inpFinale" rows="3">Cảm ơn Thầy Cô — những người đã dạy chúng em cách cất cánh, và luôn là bầu trời để chúng em quay về.</textarea>
      </div>
    </form>

    <aside class="card actions-card">
      <button type="button" class="btn-primary" id="btnGen">Tạo link chia sẻ</button>

      <div class="result" id="result" hidden>
        <label class="lbl" for="linkOut">Link chia sẻ</label>
        <input type="text" class="link-out" id="linkOut" readonly onclick="this.select()">
        <div class="result-actions">
          <button type="button" class="btn-secondary" id="btnCopy">Sao chép</button>
          <a class="btn-secondary" id="btnPreview" target="_blank" rel="noopener">Mở thử ↗</a>
        </div>
        <div class="link-meta" id="linkMeta"></div>
      </div>

      <div class="tip">
        <strong>Mẹo:</strong> Link chứa toàn bộ nội dung thư — không cần server, không cần database. Chỉ cần upload 2 file <code>index.html</code> (thư) và <code>builder.html</code> (trang này) lên GitHub Pages là dùng được.
      </div>
    </aside>
  </div>
</div>

<script>
/* Nếu bạn đổi tên file thư, sửa ở đây: */
const LETTER_FILENAME = 'index.html';

const DEFAULT_PARAS = [
  "Có những chuyến bay không cần đến sân bay. Chỉ cần một tờ giấy, vài nếp gấp, và một niềm tin rằng lời cảm ơn rồi sẽ tìm được đúng người để trao.",
  "Chiếc máy bay giấy nhỏ này mang theo lời tri ân của chúng em — những đứa học trò từng ngồi dưới mái trường, từng run tay khi bị gọi lên bảng, từng lén nhìn thầy cô viết bảng mỗi sớm mai.",
  "Thầy cô đã dạy chúng em đọc một con chữ, viết một ước mơ, và hơn hết — dạy chúng em cách trở thành một người tử tế. Những điều ấy không nằm trong sách giáo khoa, nhưng lại là hành trang lớn nhất chúng em mang theo suốt cuộc đời.",
  "Ngày 20/11 này, chúng em không gửi hoa, cũng chẳng gửi quà. Chúng em chỉ gửi một chuyến bay nhỏ xíu chở đầy lời cảm ơn, và một lời hẹn: chúng em sẽ bay thật xa, nhưng sẽ không bao giờ quên nơi mình đã học cách cất cánh.",
  "Kính chúc Thầy Cô thật nhiều sức khoẻ, bình an, và luôn giữ được ngọn lửa của người gieo chữ."
];

const parasList = document.getElementById('parasList');

function makeParaRow(value = '') {
  const row = document.createElement('div');
  row.className = 'para-row';

  const ta = document.createElement('textarea');
  ta.rows = 3;
  ta.value = value;
  ta.placeholder = 'Nhập nội dung đoạn thư...';

  const rm = document.createElement('button');
  rm.type = 'button';
  rm.className = 'para-remove';
  rm.title = 'Xoá đoạn này';
  rm.textContent = '×';
  rm.addEventListener('click', () => row.remove());

  row.appendChild(ta);
  row.appendChild(rm);
  parasList.appendChild(row);
  return row;
}

DEFAULT_PARAS.forEach(p => makeParaRow(p));

document.getElementById('addPara').addEventListener('click', () => {
  const row = makeParaRow('');
  row.querySelector('textarea').focus();
});

function encodeData(obj) {
  const json = JSON.stringify(obj);
  const bytes = new TextEncoder().encode(json);
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function getLetterUrl() {
  const url = new URL(location.href);
  url.pathname = url.pathname.replace(/[^/]*$/, LETTER_FILENAME);
  url.search = '';
  url.hash = '';
  return url.href;
}

const btnGen = document.getElementById('btnGen');
const result = document.getElementById('result');
const linkOut = document.getElementById('linkOut');
const btnCopy = document.getElementById('btnCopy');
const btnPreview = document.getElementById('btnPreview');
const linkMeta = document.getElementById('linkMeta');

btnGen.addEventListener('click', () => {
  const paragraphs = Array.from(parasList.querySelectorAll('textarea'))
    .map(ta => ta.value.trim())
    .filter(Boolean);

  if (!paragraphs.length) {
    alert('Vui lòng nhập ít nhất một đoạn thư.');
    return;
  }

  const data = {
    to: document.getElementById('inpTo').value.trim(),
    paragraphs,
    signature: document.getElementById('inpSign').value.trim(),
    signatureSub: document.getElementById('inpSignSub').value.trim(),
    finale: document.getElementById('inpFinale').value.trim()
  };

  const url = getLetterUrl() + '#d=' + encodeData(data);
  linkOut.value = url;
  btnPreview.href = url;
  result.hidden = false;

  if (url.length > 1800) {
    linkMeta.className = 'link-meta warn';
    linkMeta.textContent = `⚠ Link khá dài (${url.length} ký tự). Một số ứng dụng chat/email có thể cắt bớt — cân nhắc rút gọn nội dung.`;
  } else {
    linkMeta.className = 'link-meta';
    linkMeta.textContent = `✓ Độ dài link: ${url.length} ký tự. Sẵn sàng chia sẻ.`;
  }
});

btnCopy.addEventListener('click', async () => {
  if (!linkOut.value) return;
  try {
    await navigator.clipboard.writeText(linkOut.value);
  } catch {
    linkOut.select();
    document.execCommand('copy');
  }
  const orig = btnCopy.textContent;
  btnCopy.textContent = '✓ Đã chép';
  btnCopy.classList.add('copied');
  setTimeout(() => {
    btnCopy.textContent = orig;
    btnCopy.classList.remove('copied');
  }, 1800);
});
</script>
</body>
</html>
